name: hardlink-audit
services:
  hardlink-audit:
    image: ghcr.io/guimartins/hardlink-audit:latest
    container_name: hardlink-audit
    network_mode: host
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostroot:ro
      - /DATA/AppData/$AppID/data:/data
    environment:
      HOST_ROOT_MOUNT: /hostroot
      DATA_DIR: /data
      HA_INTERVAL_HOURS: "6"
x-casaos:
  architectures:
    - amd64
    - arm64
  id: com.guimartins.hardlink-audit
  main: hardlink-audit
  description:
    en_US: Audits hardlink integrity between qBittorrent and Radarr/Sonarr
    pt_BR: Audita integridade de hardlink entre qBittorrent e Radarr/Sonarr
  tagline:
    en_US: Hardlink integrity audit for qBittorrent + Radarr/Sonarr
    pt_BR: Auditoria de hardlink entre qBittorrent e Radarr/Sonarr
  developer: GuiMartins
  author: GuiMartins
  icon: https://raw.githubusercontent.com/GuiMartins/hardlink-audit/main/Apps/hardlink-audit/icon.svg
  thumbnail: ""
  title:
    en_US: hardlink-audit
  category: Utilities
  port_map: "8990"
  scheme: http
  index: /
